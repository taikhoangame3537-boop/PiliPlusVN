name: Build iOS Flutter App

on:
  push:
    branches: [ "main" ]

jobs:
  build-ios:
    name: Build iOS on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: ./tên-thư-mục-con   # <--- Thêm dòng này nếu code nằm trong thư mục con

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
        working-directory: ./tên-thư-mục-con   # <--- Thêm dòng này

      - name: Build iOS Release (No Codesign)
        run: |
          flutter build ios --release --no-codesign
        working-directory: ./tên-thư-mục-con   # <--- Thêm dòng này

      - name: Archive built app
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -r ../../../ios-app-release.zip Payload
          cd ../../..
        working-directory: ./tên-thư-mục-con   # <--- Thêm dòng này

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-artifact
          path: tên-thư-mục-con/build/ios/iphoneos/ios-app-release.zip # Trỏ đúng đường dẫn file zip nén
